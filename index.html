<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nithya Joseph Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Nithya Joseph, Java backend developer. Spring Boot, microservices and generative AI projects. Coimbatore, India.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Anek+Tamil:wght@600;800&display=swap">
<style>
/* Layout concept: an engineer's workspace. Hairline grid, a code panel beside the portrait, projects presented as files with browser-framed screenshots, sections numbered 01 to 06 because they follow the order a recruiter reads. */
:root{
  --bg:#0B1220; --bg2:#0E172A; --surface:#111B30; --ink:#E6EDF7; --muted:#93A4BF; --line:#22324F;
  --accent:#5AA2FF; --on-accent:#07101F; --ok:#3DD6A0; --warn:#F5B84A; --alert:#FF7A7A; --shadow:rgba(0,0,0,.35);
  --grid:rgba(90,162,255,.07);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --tk:#C792EA; --tt:#82AAFF; --ts:#A5E075; --tn:#F78C6C; --tp:#7FDBCA;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F6F8FC; --bg2:#EDF1F8; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#4D5F7A; --line:#D5DEEB;
    --accent:#1658C9; --on-accent:#FFFFFF; --ok:#0A7F5F; --warn:#9A6200; --alert:#C03A3A; --shadow:rgba(15,27,45,.12);
    --grid:rgba(22,88,201,.06);
    --tk:#8A3FB5; --tt:#1658C9; --ts:#2E7D32; --tn:#B5470F; --tp:#0A7080; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#F6F8FC; --bg2:#EDF1F8; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#4D5F7A; --line:#D5DEEB;
  --accent:#1658C9; --on-accent:#FFFFFF; --ok:#0A7F5F; --warn:#9A6200; --alert:#C03A3A; --shadow:rgba(15,27,45,.12);
  --grid:rgba(22,88,201,.06);
  --tk:#8A3FB5; --tt:#1658C9; --ts:#2E7D32; --tn:#B5470F; --tp:#0A7080; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
img{display:block;max-width:100%;height:auto}
p{margin:0}
a{color:var(--accent)}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.02em}
ul,ol{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{padding-block:clamp(60px,8vw,108px);border-top:1px solid var(--line);overflow-x:clip}
.band.alt{background:var(--bg2)}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted)}

.eyebrow{display:flex;align-items:center;gap:12px;font:500 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
.eyebrow span{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:2px 8px;color:var(--muted)}
h2{font-size:clamp(1.9rem,3.8vw,2.8rem);font-weight:600;max-width:22ch}
.head{margin-bottom:clamp(32px,4vw,52px)}
.lead{color:var(--muted);max-width:62ch;margin-top:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 20px;border-radius:8px;font:500 15px var(--sans);text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);cursor:pointer;transition:border-color .2s,transform .2s,background .2s}
.btn:hover{border-color:var(--accent);transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px 24px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--ink);text-decoration:none}
.mark{width:34px;height:34px;border-radius:8px;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font:600 13px var(--mono)}
header nav{display:flex;gap:4px}
header nav a{color:var(--muted);text-decoration:none;font-size:14.5px;font-weight:500;padding:8px 12px;border-radius:6px}
header nav a:hover,header nav a.on{color:var(--ink);background:var(--surface)}
.icon-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.prog{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(0)}
@media (max-width:860px){header nav a:not(.keep){display:none}}

/* hero */
.hero{position:relative;padding-block:clamp(28px,4vw,56px) clamp(56px,7vw,100px);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px;background-position:-1px -1px;overflow-x:clip}
.net{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.9;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent)}
.hero-in{position:relative}
.status{display:inline-flex;align-items:center;gap:10px;font:500 13px var(--mono);color:var(--muted);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;margin:0}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:ping 2.2s infinite;display:inline-block}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent)}70%,100%{box-shadow:0 0 0 9px transparent}}
.giant{font-size:clamp(3rem,11.5vw,9.4rem);font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:clamp(18px,3vw,34px);max-width:none}
.giant[lang="ta"]{font-family:'Anek Tamil','Noto Sans Tamil',var(--sans);letter-spacing:-.02em;font-size:clamp(2.6rem,9.6vw,7.8rem)}
.gline{display:block;overflow:hidden;padding-block:.14em .3em;margin-bottom:-.18em;white-space:nowrap}
.gch{display:inline-block}
.gch.acc{color:var(--accent)}
.gch.go{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{transform:translateY(115%) rotate(5deg)}}
.typed-line{font-size:clamp(1.4rem,3.2vw,2.3rem);font-weight:600;letter-spacing:-.03em;margin-top:6px;line-height:1.25}
.typed-line .art{color:var(--accent)}
.tcaret{display:inline-block;width:3px;height:.95em;background:var(--accent);margin-left:4px;vertical-align:-.1em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(28px,5vw,72px);align-items:start;margin-top:clamp(28px,4vw,44px)}
.sub{color:var(--muted);max-width:56ch}
.hero-rows{display:flex;flex-wrap:wrap;gap:22px 52px;margin-top:30px}
.hero-rows h4{margin:0 0 12px;font:500 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.tiles{display:flex;gap:12px;flex-wrap:wrap}
.tile{width:50px;height:50px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);box-shadow:0 8px 18px var(--shadow);transition:transform .2s,border-color .2s;text-decoration:none}
a.tile:hover{transform:translateY(-3px);border-color:var(--accent)}
.tile svg.i{width:22px;height:22px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.pframe{position:relative;margin:0 0 0 auto;width:min(100%,380px);aspect-ratio:4/5;border:1px solid var(--line);border-radius:6px;background:#0A1226;overflow:hidden;box-shadow:0 30px 60px var(--shadow)}
.pframe img{width:100%;height:100%;object-fit:cover;object-position:50% 14%}
.pframe::before,.pframe::after{content:"";position:absolute;width:34px;height:34px;border:2px solid var(--accent);z-index:2;pointer-events:none}
.pframe::before{top:12px;left:12px;border-right:0;border-bottom:0}
.pframe::after{top:12px;right:12px;border-left:0;border-bottom:0}
.pframe figcaption{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:linear-gradient(0deg,rgba(7,13,28,.92),rgba(7,13,28,.55));border-top:1px solid rgba(160,190,240,.2);color:#E6EDF7;font:500 12.5px var(--mono)}
.pframe figcaption span{display:inline-flex;align-items:center;gap:8px;color:#A9BBD9}
.pframe figcaption b{font-weight:600}
@media (max-width:900px){.hero-grid{grid-template-columns:minmax(0,1fr)}.pframe{margin-inline:auto;order:-1;width:min(100%,320px)}}

/* about */
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:start}
.about-text p{max-width:60ch}
.about-text p+p{margin-top:16px;color:var(--muted)}
.langs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;margin:30px 0 0;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.langs div{background:var(--surface);padding:12px 16px;display:flex;justify-content:space-between;gap:10px}
.langs dt{font-weight:600}.langs dd{margin:0;color:var(--muted);font:400 13px var(--mono)}
.edu{display:grid;gap:16px}
.when{font:500 13px var(--mono);color:var(--accent);margin-bottom:8px}
.card h3{font-size:1.12rem;font-weight:600}
.card p{margin-top:6px}

/* skills */
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.sk{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;transition:border-color .25s,transform .25s}
.sk:hover{border-color:var(--accent);transform:translateY(-3px)}
.sk code{display:block;font:500 13px var(--mono);color:var(--ok);margin-bottom:8px}
.sk h3{font-size:1.05rem;font-weight:600;margin-bottom:16px}
.sk ul{display:flex;flex-wrap:wrap;gap:8px}
.sk li svg{width:16px;height:16px}
.sk li{display:inline-flex;align-items:center;gap:7px;font:500 13px var(--mono);padding:5px 10px;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.sk.primary{border-color:var(--accent)}
.sk.primary li{border-color:color-mix(in srgb,var(--accent) 50%,var(--line))}
.soft{margin-top:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px 22px}
.soft>span{font:500 13px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.soft ul{display:flex;flex-wrap:wrap;gap:8px 20px;font-weight:500}
@media (max-width:1020px){.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.skills{grid-template-columns:minmax(0,1fr)}}

/* projects */
.proj{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(28px,4.5vw,60px);align-items:start;padding-block:clamp(36px,5vw,64px);border-top:1px solid var(--line)}
.proj:first-of-type{border-top:0;padding-top:0}
.proj.flip .media{order:-1}
.file{display:inline-flex;align-items:center;gap:8px;font:500 13px var(--mono);color:var(--muted);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.dotf{width:8px;height:8px;border-radius:2px;background:var(--accent)}
.kind{font:500 13px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ok);margin-top:18px}
.proj h3{font-size:clamp(1.55rem,2.8vw,2.1rem);font-weight:600;margin:8px 0 14px}
.what{color:var(--muted)}
.pts{margin-top:20px;display:grid;gap:10px}
.pts li{position:relative;padding-left:24px}
.pts li::before{content:"\203A";position:absolute;left:4px;top:-1px;color:var(--accent);font:600 20px var(--mono)}
.stack{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.stack li{font:500 13px var(--mono);padding:5px 10px;border-radius:6px;background:var(--bg2);border:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:10px;margin-top:22px;border:1px solid var(--ok);color:var(--ok);border-radius:8px;padding:8px 14px;font:500 14px var(--sans)}
.media{display:grid;gap:18px;min-width:0}
.shot{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 18px 40px var(--shadow)}
.chrome{display:flex;align-items:center;gap:6px;padding:9px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
.chrome i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.chrome span{font:500 12px var(--mono);color:var(--muted);margin-left:8px}
.zoom{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in}
.zoom img{width:100%;transition:transform .5s}
.zoom:hover img{transform:scale(1.015)}
.shot .zoom{overflow:hidden}
.lidar-body{position:relative;aspect-ratio:16/10;background:var(--bg2);overflow:hidden}
.rings{position:absolute;left:50%;top:50%;width:92%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 13%,var(--line) 13% 13.6%)}
.sweep{position:absolute;left:50%;top:50%;width:92%;aspect-ratio:1;margin:0;transform:translate(-50%,-50%);border-radius:50%;background:conic-gradient(from 0deg,transparent 0 285deg,color-mix(in srgb,var(--ok) 45%,transparent) 360deg);animation:spin 5s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.car{position:absolute;left:50%;top:50%;width:26px;height:14px;margin:-7px 0 0 -13px;border-radius:4px;background:var(--ink)}
.pt{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--ok)}
.pt.bad{background:var(--alert);animation:ring 1.6s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--alert) 60%,transparent)}70%,100%{box-shadow:0 0 0 12px transparent}}
.legend{position:absolute;left:14px;bottom:10px;display:flex;gap:16px;font:500 12px var(--mono);color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)}
.legend .b::before{background:var(--alert)}
@media (max-width:900px){.proj{grid-template-columns:minmax(0,1fr)}.proj.flip .media{order:0}}


.shots-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.shots-row .shot{box-shadow:0 12px 26px var(--shadow)}
.shots-row .zoom{aspect-ratio:3/2;overflow:hidden;background:var(--surface)}
.shots-row .zoom img{width:100%;height:100%;object-fit:cover;object-position:top left}
.viz-body{position:relative;background:var(--bg2);padding:18px}
.flight svg{width:100%;height:auto;display:block}
.vgrid line{stroke:var(--line);stroke-width:1;opacity:.55}
.route{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:7 7;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.vnode{fill:var(--bg2);stroke:var(--accent);stroke-width:3}.vnode.end{stroke:var(--ok)}
.vtext{fill:var(--ink);font:600 15px var(--mono)}
.plane path{fill:var(--ink)}
.vchips,.pipe{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.vchips li,.pipe li{font:500 12.5px var(--mono);padding:6px 11px;border-radius:7px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.cyc{animation:lit 6s infinite}
@keyframes lit{0%,16%{border-color:var(--ok);color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}22%,100%{border-color:var(--line);color:var(--muted);background:var(--surface)}}
.pipe li{position:relative}
.pipe li+li::before{content:"\2192";position:absolute;left:-17px;color:var(--muted)}
.pipe{gap:20px;padding-left:2px;flex-wrap:nowrap}
.pipe li{padding:6px 9px;font-size:12px;white-space:nowrap}
.pipe li+li::before{left:-15px}
.outcard{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:10px}
.skel{height:9px;border-radius:5px;background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--accent) 45%,var(--line)),var(--line));background-size:200% 100%;animation:shimmer 2.2s linear infinite}
.w90{width:90%}.w80{width:80%}.w70{width:70%}
@keyframes shimmer{to{background-position:-200% 0}}
.qopts{display:flex;gap:10px;margin-top:6px}
.qopts span{flex:1;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--bg2)}
.qopts .right{animation:pick 6s infinite}
@keyframes pick{0%,50%{border-color:var(--line);background:var(--bg2)}60%,90%{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--bg2))}100%{border-color:var(--line);background:var(--bg2)}}
.scan{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:18px;align-items:center}
.scanbox{position:relative;aspect-ratio:1;border-radius:10px;border:1px solid var(--line);overflow:hidden;background-color:var(--surface);background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:16px 16px}
.scanline{position:absolute;left:0;right:0;height:3px;background:var(--ok);box-shadow:0 0 14px 3px color-mix(in srgb,var(--ok) 70%,transparent);animation:scanmove 3.4s ease-in-out infinite alternate}
@keyframes scanmove{from{top:4%}to{top:94%}}
.mods{display:grid;gap:12px;min-width:0}
.mod span{display:block;font:500 12.5px var(--mono);color:var(--muted);margin-bottom:6px}
.mbar{height:7px;border-radius:4px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:4px;animation:fill 6s infinite}
.mod.final .mbar i{background:var(--warn)}
@keyframes fill{0%{width:0}18%,82%{width:100%}95%,100%{width:0}}
.vnote{font-size:13px;color:var(--muted);line-height:1.5}
@media (max-width:520px){.scan{grid-template-columns:minmax(0,1fr)}.shots-row{grid-template-columns:minmax(0,1fr)}}

/* experience */
.exp-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:clamp(28px,4vw,56px);align-items:start}
.log{display:grid;gap:20px;position:relative;padding-left:28px}
.log::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:1px;background:var(--line)}
.job{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}
.job::before{content:"";position:absolute;left:-28px;top:30px;width:11px;height:11px;border-radius:50%;background:var(--bg2);border:2px solid var(--accent)}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font:500 13px var(--mono);color:var(--accent)}
.meta span+span{color:var(--muted)}
.job h3{font-size:1.25rem;font-weight:600;margin-top:10px}
.org{color:var(--muted);font-weight:500;margin-top:2px}
.job ul{margin-top:16px;display:grid;gap:10px}
.job li{position:relative;padding-left:20px;color:var(--ink)}
.job li::before{content:"";position:absolute;left:2px;top:.72em;width:8px;height:1px;background:var(--accent)}
.exp-photo{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;position:sticky;top:96px}
.exp-photo img{border-radius:8px;aspect-ratio:4/3;object-fit:cover;width:100%}
.exp-photo figcaption{font:500 13px var(--mono);color:var(--muted);margin-top:10px}
@media (max-width:900px){.exp-grid{grid-template-columns:minmax(0,1fr)}.exp-photo{position:static;max-width:420px}}

/* achievements */
.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.gcard{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.gcard .zoom img{aspect-ratio:4/5;object-fit:cover;width:100%}
.gcard figcaption{padding:14px 16px 16px;display:grid;gap:4px}
.gcard b{font-weight:600}
.gcard span{color:var(--muted);font-size:14.5px;line-height:1.5}
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:16px}
.certs-head{margin-top:64px;margin-bottom:20px}
.certs-head h3{font-size:1.5rem;font-weight:600}
.certs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cert{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.cert .d{font:500 12.5px var(--mono);color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:4px 9px;white-space:nowrap;background:var(--bg2)}
.cert b{display:block;font-weight:600;line-height:1.3}
.cert span:not(.d){color:var(--muted);font-size:14.5px}
@media (max-width:1020px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.gallery,.roles,.certs{grid-template-columns:minmax(0,1fr)}}

/* contact */
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:center}
.contact h2{max-width:16ch}
.loc{display:flex;align-items:center;gap:10px;margin-top:22px;color:var(--muted);font:500 14px var(--mono)}
.cbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;display:grid;gap:14px;box-shadow:0 24px 50px var(--shadow)}
.mailrow{display:flex;gap:10px;flex-wrap:wrap}
.mail{flex:1 1 230px;min-width:0;font:500 15px var(--mono);background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:11px 14px;overflow-wrap:anywhere;user-select:all}
.copyok{font:500 13px var(--mono);color:var(--ok);min-height:1.3em}
.links2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:820px){.contact-grid{grid-template-columns:minmax(0,1fr)}}
footer{border-top:1px solid var(--line);padding-block:26px;color:var(--muted);font:400 13px var(--mono)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}


/* word reveal headings */
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em}
.w>span{display:inline-block;transition:transform .85s cubic-bezier(.2,.8,.2,1)}
.rv:not(.in) .w>span{transform:translateY(112%)}

/* spotlight */
.spot{position:relative}
.spot::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(280px circle at var(--mx,-999px) var(--my,-999px),color-mix(in srgb,var(--accent) 18%,transparent),transparent 62%)}
.spot:hover::after{opacity:1}

/* marquee */
.marquee{margin-top:36px;display:grid;gap:12px;overflow:hidden;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mrow{display:flex;gap:12px;width:max-content;animation:marq 42s linear infinite}
.mrow.rev{animation-direction:reverse;animation-duration:52s}
.marquee:hover .mrow{animation-play-state:paused}
.mrow li{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font:500 14px var(--mono);white-space:nowrap}
.mrow li svg.i{color:var(--accent)}
@keyframes marq{to{transform:translateX(-50%)}}
.skills{margin-top:28px}

/* project media sequence */
.proj .media>*{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.proj.rv:not(.in) .media>*{transform:translateY(40px)}
.proj .media>*:nth-child(2){transition-delay:.18s}
.proj .proj-info>*{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.proj.rv:not(.in) .proj-info>*{transform:translateX(-24px)}
.proj .proj-info>*:nth-child(2){transition-delay:.05s}.proj .proj-info>*:nth-child(3){transition-delay:.1s}.proj .proj-info>*:nth-child(4){transition-delay:.15s}.proj .proj-info>*:nth-child(5){transition-delay:.2s}.proj .proj-info>*:nth-child(6){transition-delay:.25s}

/* experience timeline draws itself */
.log{--p:1}
.log::after{content:"";position:absolute;left:4px;top:10px;bottom:10px;width:3px;border-radius:2px;background:linear-gradient(var(--accent),var(--ok));transform-origin:top;transform:scaleY(var(--p));box-shadow:0 0 12px color-mix(in srgb,var(--accent) 60%,transparent)}
.job.rv:not(.in){transform:translateX(30px)}
.job::before{transition:background .5s,box-shadow .5s}
.job.in::before{background:var(--accent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent)}

/* gallery stagger */
.gallery .gcard:nth-child(2){transition-delay:.1s}.gallery .gcard:nth-child(3){transition-delay:.2s}.gallery .gcard:nth-child(4){transition-delay:.3s}
.gcard:hover{border-color:var(--accent)}
.certs .cert:nth-child(even){transition-delay:.08s}
.confetti{position:fixed;inset:0;width:100vw;height:100vh;z-index:90;pointer-events:none}

/* lightbox */
.lb{position:fixed;inset:0;z-index:100;background:rgba(4,9,20,.88);display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb figure{margin:0;max-width:min(1100px,100%);display:grid;gap:10px;justify-items:center}
.lb img{max-height:78vh;width:auto;border-radius:8px;background:#fff}
.lb figcaption{color:#fff;font:500 14px var(--mono)}
.lb button{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:8px;border:0;background:#fff;color:#0F1B2D;font:600 22px var(--sans);cursor:pointer}

/* reveal: always visible, slides into place */
.rv{transition:transform .75s cubic-bezier(.2,.8,.2,1)}
.rv:not(.in){transform:translateY(26px)}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .dot,.tcaret,.sweep,.pt.bad,.route,.cyc,.skel,.qopts .right,.scanline,.mbar i,.blob,.fchip{animation:none}
  .mbar i{width:72%}
  .mrow{animation:none;flex-wrap:wrap;width:auto}
  .marquee{-webkit-mask-image:none;mask-image:none}
  .w>span{transition:none}
  .gch.go{animation:none}
  .log::after{transform:none}
  .scanline{top:40%}
  .rv:not(.in){transform:none}
  .rv,.rot,.zoom img,.sk,.btn{transition:none}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="app.js"></script>
</body>
</html>
